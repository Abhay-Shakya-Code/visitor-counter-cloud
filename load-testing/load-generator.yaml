apiVersion: v1
kind: Pod
metadata:
  name: visitor-load-generator
  namespace: visitor-counter
spec:
  restartPolicy: Never
  containers:
    - name: load-generator
      image: visitor-counter:slim
      imagePullPolicy: IfNotPresent
      command:
        - python
        - -u
        - -c
      args:
        - |
          import concurrent.futures
          import time
          import urllib.request

          URL = "http://visitor-counter.visitor-counter.svc.cluster.local/"
          WORKERS = 30
          DURATION = 120

          success = 0
          failed = 0
          deadline = time.monotonic() + DURATION

          def hit(_):
              try:
                  with urllib.request.urlopen(URL, timeout=5) as response:
                      response.read()
                      return response.status == 200
              except Exception as exc:
                  print("Request error:", repr(exc), flush=True)
                  return False

          print("Load test started", flush=True)

          with concurrent.futures.ThreadPoolExecutor(
              max_workers=WORKERS
          ) as pool:
              while time.monotonic() < deadline:
                  results = list(pool.map(hit, range(WORKERS)))
                  success += sum(results)
                  failed += len(results) - sum(results)

                  print(
                      f"Completed={success + failed}, "
                      f"Successful={success}, Failed={failed}",
                      flush=True
                  )

          print("LOAD_TEST_FINISHED", flush=True)

      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 192Mi
